<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokeClicker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">
    <h1>⚡ POKECLICKER ⚡</h1>

    <div class="stats">
      <div id="coins">🪙 Münzen: 0</div>
      <div id="level">⭐ Level: 1</div>
      <div id="power">💥 Klick-Power: 1</div>
    </div>

    <div id="pokemon" class="pokemon">
      ⚡ Pikachu
    </div>

    <button class="click-button" onclick="clickPokemon()">
      👆 KLICKEN!
    </button>

    <button class="change-button" onclick="changePokemon()">
      🔄 Neues Pokémon
    </button>

  </main>

  <script src="game.js"></script>

</body>
</html>
